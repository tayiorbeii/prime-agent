[project]
name = "prime-persona-team-skill"
version = "0.1.0"
description = "Prime Persona Teams control skill"
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/persona_team"]

[tool.prime_agent.skill]
import = "persona_team"
